<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Kev Nay POS - Redirigiendo...</title>
    <script>
      // Single Page Apps for GitHub Pages
      (function() {
        var path = window.location.pathname;
        var segments = path.split('/').filter(Boolean);
        var repoName = segments.length > 0 ? '/' + segments[0] : '';
        // If loaded on GitHub Pages subfolder (e.g. /KevNay/)
        var target = repoName ? repoName + '/' : '/';
        window.location.replace(window.location.origin + target);
      })();
    </script>
  </head>
  <body style="margin: 0; background-color: #0c1322; color: #dce2f7; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center;">
    <div>
      <div style="width: 44px; height: 44px; border: 3px solid rgba(220, 38, 38, 0.2); border-top-color: #dc2626; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px auto;"></div>
      <h2 style="font-size: 18px; font-weight: 700; color: #ffffff; margin: 0 0 6px 0;">Kev Nay POS</h2>
      <p style="font-size: 13px; color: #94a3b8; margin: 0;">Redirigiendo a la terminal de punto de venta...</p>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
    </div>
  </body>
</html>
