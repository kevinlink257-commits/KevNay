<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Kev Nay POS & Cloud Hub</title>
    <meta name="description" content="Terminal de punto de venta retail de alta fidelidad con bloqueo por PIN, arqueo de caja, facturación e inventario." />
    <meta property="og:title" content="Kev Nay POS & Cloud Hub" />
    <meta property="og:description" content="Terminal de punto de venta retail de alta fidelidad con bloqueo por PIN, arqueo de caja, facturación e inventario." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />

    <!-- Trailing-slash normalization for GitHub Pages / subfolder deployments -->
    <script>
      (function() {
        try {
          var p = window.location.pathname;
          if (p && !p.endsWith('/') && !p.split('/').pop().includes('.')) {
            window.location.replace(window.location.origin + p + '/' + window.location.search + window.location.hash);
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-[#0c1322] text-[#dce2f7] antialiased selection:bg-[#dc2626] selection:text-white overflow-x-hidden min-h-screen">
    <div id="root">
      <!-- Branded initial loader to prevent blank white screens during bundle download -->
      <div style="min-height: 100vh; background-color: #0c1322; color: #dce2f7; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 24px;">
        <div style="width: 48px; height: 48px; border: 3px solid rgba(220, 38, 38, 0.2); border-top: 3px solid #dc2626; border-radius: 50%; animation: knSpin 0.75s linear infinite; margin-bottom: 20px;"></div>
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
          <div style="width: 10px; height: 10px; border-radius: 50%; background-color: #dc2626; box-shadow: 0 0 10px #dc2626;"></div>
          <span style="font-size: 20px; font-weight: 700; color: #ffffff; letter-spacing: -0.01em;">KEV NAY POS</span>
        </div>
        <p style="font-size: 13px; color: #94a3b8; margin: 0;">Iniciando terminal de punto de venta retail...</p>
        <noscript>
          <div style="margin-top: 20px; padding: 14px 20px; background: rgba(220, 38, 38, 0.15); border: 1px solid #dc2626; border-radius: 10px; color: #fca5a5; font-size: 13px; max-width: 360px;">
            Esta terminal requiere JavaScript para operar. Por favor activa JavaScript en la configuración de tu navegador.
          </div>
        </noscript>
      </div>
      <style>
        @keyframes knSpin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
